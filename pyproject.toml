[project]
name = "momentum-timing"
version = "1.0.0"
description = "基于量价斜率指标的量化择时策略回测系统"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "AI-Generated Educational Tool" },
]
keywords = ["量化交易", "择时策略", "回测", "A股"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "baostock>=0.9.0",
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "scikit-learn>=1.0.0",
    "plotly>=5.0.0",
    "tqdm>=4.60.0",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
backtest = "run_backtest:main"

[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
